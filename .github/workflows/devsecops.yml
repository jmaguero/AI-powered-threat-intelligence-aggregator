name: DevSecOps pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * *" # Nightly scan for new vulnerabilities

# Define permissions for GitHub Advanced Security features (if available)
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------
  # Phase 1: SECRET SCANNING (Fail fast if keys leaked)
  # ---------------------------------------------------
  secret-scan:
    name: 🕵️‍♀️ TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history to scan past commits

      # Trufflehog will fail the build immediately if it finds verified secrets
      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ---------------------------------------------------
  # Phase 2: STATIC CODE ANALYSIS (SAST & OWASP LLM)
  # ---------------------------------------------------
  sast:
    name: 🔬 SAST (Semgrep & Bandit)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Semgrep handles standard web vulnerabilities and OWASP LLM Rules
      - name: Run Semgrep (Web & LLM Security Rules)
        run: |
          pip install semgrep
          semgrep scan --config="p/default" --config="p/owasp-top-ten" --config="p/python" --config="p/django" --config="p/react" --config="p/javascript" --sarif > semgrep.sarif || true

      - name: Upload Semgrep SARIF to GitHub Security Dashboard
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Bandit for Python-specific security checks
      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r ./backend -ll -ii -f json -o bandit-results.json || true # allow failure to upload results first

      - name: Upload Bandit Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json

  # ---------------------------------------------------
  # Phase 3: SOFTWARE COMPOSITION ANALYSIS (SCA)
  # ---------------------------------------------------
  sca:
    name: 📦 Dependency Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: false
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF to GitHub Security Dashboard
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-fs

  # ---------------------------------------------------
  # Phase 4: CONTAINER SECURITY
  # ---------------------------------------------------
  container-security:
    name: 🐳 Docker Image Scan
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Build the image using the latest commit sha
      - name: Build Application Docker Image
        run: |
          # Example build command depending on your actual structure
          docker build -t app-image:${{ github.sha }} -f docker/Dockerfile.backend .

      - name: Scan Built Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "app-image:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image-results.sarif"
          exit-code: "1" # Fail pipeline if Critical/High are found in the base image
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"
          category: trivy-image

  # ---------------------------------------------------
  # Phase 5: DYNAMIC APPLICATION SECURITY TESTING (DAST)
  # ---------------------------------------------------
  dast:
    name: ⚡ OWASP ZAP Dynamic Scan
    runs-on: ubuntu-latest
    needs: container-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Architecture Note: Currently spins up the local Ollama stack.
      # Future Phase B: We will mock responses or use a dedicated staging OPENROUTER_API_KEY
      - name: Spin up staging environment (Docker Compose)
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for Application & Ollama Readiness
        run: |
          echo "Waiting for backend API..."
          sleep 45 # Adjust based on startup time

      - name: OWASP ZAP Baseline Scan (Targeting LLM Endpoints & Web UI)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000" # Backend API for DAST testing
          rules_file_name: ".zap/rules.tsv" # Optional: tune zap rules
          cmd_options: "-a" # Run AJAX spider for single page applications (React)
          fail_action: true # Enforce failure to block PRs merging to main
